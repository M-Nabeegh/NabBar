name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/nabbar-icon.png
      - docs/menubar.png
      - docs/touchportal-tiles.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp docs/nabbar-icon.png docs/menubar.png docs/touchportal-tiles.png _site/img/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
